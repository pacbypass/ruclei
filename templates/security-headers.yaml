id: security-headers-missing

info:
  name: Missing Security Headers
  author: [ruclei]
  severity: medium
  description: Check for missing security headers
  tags: [security, headers, misconfiguration]

requests:
  - method: GET
    path:
      - "/"
    
    matchers:
      - type: dsl
        dsl:
          - "!contains(header, 'X-Frame-Options')"
        name: "missing-x-frame-options"
      - type: dsl
        dsl:
          - "!contains(header, 'X-Content-Type-Options')"
        name: "missing-x-content-type-options"
      - type: dsl
        dsl:
          - "!contains(header, 'Strict-Transport-Security')"
        name: "missing-hsts"